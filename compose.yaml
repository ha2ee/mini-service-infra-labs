services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: mini-service-app
    environment:
      LAB_ENV: local

  nginx:
    image: nginx:1.27-alpine
    container_name: mini-service-nginx
    ports:
      - "18080:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app